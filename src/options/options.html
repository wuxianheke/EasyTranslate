<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="optionsTitle">EasyTranslate 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <img src="../../assets/icon-on-48.png" width="48" height="48" alt="" />
        <div>
          <h1 data-i18n="optionsHeading">EasyTranslate</h1>
          <p data-i18n="optionsSubtitle">左键切换当前页面，右键可开启全局翻译。</p>
        </div>
      </header>

      <form id="settings-form">
        <label>
          <span data-i18n="modelLabel">模型</span>
          <select id="model" name="model"></select>
        </label>

        <label>
          <span data-i18n="apiKeyLabel">DeepSeek API Key</span>
          <input id="api-key" name="apiKey" type="password" autocomplete="off" placeholder="sk-..." required />
        </label>

        <div class="language-row">
          <label>
            <span data-i18n="sourceLanguageLabel">原语言</span>
            <select id="source-language" name="sourceLanguage"></select>
          </label>
          <label>
            <span data-i18n="targetLanguageLabel">目标语言</span>
            <select id="target-language" name="targetLanguage"></select>
          </label>
        </div>

        <div class="global-mode-setting">
          <div class="global-mode-copy">
            <strong data-i18n="globalModeLabel">全局翻译</strong>
            <span data-i18n="globalModeDescription">开启后，普通网页会自动启用划词翻译。</span>
          </div>
          <label class="switch">
            <input id="global-mode" type="checkbox" role="switch" aria-label="全局翻译" data-i18n-aria-label="globalModeLabel" />
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>

        <div class="actions">
          <button id="test-api" class="secondary" type="button" data-i18n="testConnectionButton">测试连接</button>
          <button class="primary" type="submit" data-i18n="saveSettingsButton">保存设置</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
      </form>

      <p class="privacy" data-i18n="privacyNote">只有选中文字和有限上下文会发送给 DeepSeek。API Key 仅保存在本机扩展存储中，不会同步。</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
